name: Release

# Manual trigger only ("Run workflow" button or: gh workflow run release.yml)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (computes version + notes, but publishes nothing)"
        type: boolean
        default: false

permissions:
  contents: write       # tags, release and changelog commit
  issues: write         # semantic-release may comment on issues/PRs
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and semantic release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache 7DTD server payload
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.7dtd-server
          key: ${{ runner.os }}-steamcmd-7dtd-v1
          restore-keys: |
            ${{ runner.os }}-steamcmd-7dtd-

      - name: Install 7DTD Dedicated Server (for build DLLs)
        run: bash scripts/install-7dtd-server.sh "${{ github.workspace }}/.7dtd-server"

      - name: Compile mod
        run: dotnet build src/SnapBounty.csproj -c Release -p:GameRoot="${{ github.workspace }}/.7dtd-server"

      - name: Install release dependencies
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
